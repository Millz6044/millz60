<!doctype html><meta charset="utf-8">
<style>
body{margin:0}
.t{width:1280px;height:720px;position:relative;overflow:hidden;font-family:Impact,'Arial Black',sans-serif;color:#fff;background-size:cover;background-position:center}
.txt{position:absolute;text-transform:uppercase;-webkit-text-stroke:10px #1b0a33;paint-order:stroke fill;line-height:.95;text-shadow:0 8px 0 #1b0a33}
.a{background-image:url(../assets/hero.jpg);background-position:35% 50%}
